<p-drawer [appendTo]="null" [(visible)]="display" position="right">
  <h2>Generate PDF</h2>
  <div class="field">
    <p-selectbutton
      [options]="printOptions"
      [(ngModel)]="selectedValue"
      optionLabel="name"
      optionValue="value"></p-selectbutton>
  </div>
  <div class="field">
    <button pButton pRipple type="button" style="width: 100%" (click)="onExport()"><span pButtonLabel>Download PDF</span></button>
  </div>
</p-drawer>
