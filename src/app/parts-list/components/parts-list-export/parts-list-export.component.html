<p-drawer [appendTo]="null" [(visible)]="display" position="right">
  <h2>Export</h2>
  <div class="field">
    <p-selectbutton
      [options]="filterOptions"
      [(ngModel)]="selectedFilterValue"
      optionLabel="name"
      optionValue="value"></p-selectbutton>
  </div>
  <div class="field">
    <label>Export To:</label>
    <p-selectbutton
      [options]="exportToOptions"
      [(ngModel)]="selectedExportToValue"
      optionLabel="name"
      optionValue="value"></p-selectbutton>
  </div>
  @if (selectedExportToValue == 'brickLink') {
    <div class="field-checkbox">
      <p-checkbox [(ngModel)]="brickLinkExportPrice" [binary]="true" [label]="'Export PaB Price'">
        <ng-template #icon let-checked="checked">
          @if (checked) {
            <svg data-p-icon="check" class="p-checkbox-icon" />
          }
        </ng-template>
      </p-checkbox>
    </div>
  }
  <div class="field">
    <button pButton pRipple type="button" style="width: 100%" (click)="onExport()">
      <span pButtonLabel>Export</span>
    </button>
  </div>

  <ng-template #closeicon><svg data-p-icon="times" /></ng-template>
</p-drawer>
