<bh-menu #menuTrans [model]="trans" [popup]="true"></bh-menu>
<bh-menu #menuBlack [model]="black" [popup]="true"></bh-menu>
<bh-menu #menuBrown [model]="brown" [popup]="true"></bh-menu>
<bh-menu #menuRed [model]="red" [popup]="true"></bh-menu>
<bh-menu #menuOrange [model]="orange" [popup]="true"></bh-menu>
<bh-menu #menuYellow [model]="yellow" [popup]="true"></bh-menu>
<bh-menu #menuGreen [model]="green" [popup]="true"></bh-menu>
<bh-menu #menuBlue [model]="blue" [popup]="true"></bh-menu>
<bh-menu #menuPurple [model]="purple" [popup]="true"></bh-menu>
<div class="flex flex-row gap-1">
  <button
    pButton
    pRipple
    type="button"
    (click)="setColor(null)"
    class="flex-grow-1"
    style="background-color: #6c757d"
    label="All"></button>
  @if (trans?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuTrans.toggle($event)"
      class="flex-grow-1 p-button-outlined"
      style="background-color: #f8f9fa; color: black"
      label="Trans"></button>
  }
  @if (black?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuBlack.toggle($event)"
      class="flex-grow-1"
      style="background-color: #343a40"></button>
  }
  @if (brown?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuBrown.toggle($event)"
      class="flex-grow-1"
      style="background-color: #7f1e06"></button>
  }
  @if (red?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuRed.toggle($event)"
      class="flex-grow-1"
      style="background-color: #dc3545"></button>
  }
  @if (orange?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuOrange.toggle($event)"
      class="flex-grow-1"
      style="background-color: #fd7e14"></button>
  }
  @if (yellow?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuYellow.toggle($event)"
      class="flex-grow-1"
      style="background-color: #ffc107"></button>
  }
  @if (green?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuGreen.toggle($event)"
      class="flex-grow-1"
      style="background-color: #28a745"></button>
  }
  @if (blue?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuBlue.toggle($event)"
      class="flex-grow-1"
      style="background-color: #007bff"></button>
  }
  @if (purple?.length) {
    <button
      pButton
      pRipple
      type="button"
      (click)="menuPurple.toggle($event)"
      class="flex-grow-1"
      style="background-color: #6f42c1"></button>
  }
</div>
