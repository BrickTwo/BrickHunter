<p-dialog header="Changelog" [(visible)]="visible" [modal]="true">
  <app-changelog [versionCheck]="true"></app-changelog>
  <ng-template #footer>
    <p-button (click)="onClose()" label="Close" styleClass="p-button-solid"></p-button>
  </ng-template>

  <ng-template #closeicon><svg data-p-icon="times" /></ng-template>
</p-dialog>
