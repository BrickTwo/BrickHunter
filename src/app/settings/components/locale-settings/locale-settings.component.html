<p-card header="Select Lego PaB Site Settings*">
  <div class="field">
    <label for="country" class="block">Country</label>
    <p-select
      id="country"
      [options]="countries"
      [(ngModel)]="selectedCountry"
      optionLabel="text"
      placeholder="Select a Country"
      appendTo="body"
      autoWidth="false"
      [style]="{ width: '100%' }"
      (onChange)="onCountrySelect()">
      <ng-template #selectedItem>
        @if (selectedCountry) {
          <div class="flex align-items-center gap-2">
            <img
              src="/assets/flag_placeholder.png"
              [class]="'flag flag-' + selectedCountry.code.toLowerCase()"
              style="width: 18px" />
            <div>{{ selectedCountry.text }}</div>
          </div>
        }
      </ng-template>
      <ng-template let-country #item>
        <div class="flex align-items-center gap-2">
          <img
            src="/assets/flag_placeholder.png"
            [class]="'flag flag-' + country.code.toLowerCase()"
            style="width: 18px" />
          <div>{{ country.text }}</div>
        </div>
      </ng-template>
    </p-select>
  </div>
  <div class="field">
    <label for="language" class="block">Language</label>
    <p-select
      id="language"
      [options]="languages"
      [(ngModel)]="selectedLanguage"
      optionLabel="text"
      placeholder="Select a Language"
      appendTo="body"
      autoWidth="false"
      [style]="{ width: '100%' }"
      (onChange)="onLanguageSelect()">
      <ng-template #selectedItem>
        @if (selectedLanguage) {
          <div class="flex align-items-center gap-2">
            <img
              src="/assets/flag_placeholder.png"
              [class]="'flag flag-' + selectedLanguage.flag.toLowerCase()"
              style="width: 18px" />
            <div>{{ selectedLanguage.text }}</div>
          </div>
        }
      </ng-template>
      <ng-template let-language #item>
        <div class="flex align-items-center gap-2">
          <img
            src="/assets/flag_placeholder.png"
            [class]="'flag flag-' + language.flag.toLowerCase()"
            style="width: 18px" />
          <div>{{ language.text }}</div>
        </div>
      </ng-template>
    </p-select>
  </div>
  <div class="field">
    * For checking the availability of parts, showing the price in your currency and it also defines the shopping cart
    at the Pick a Brick service.
  </div>
</p-card>
